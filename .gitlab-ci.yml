stages: [sync]

sync_practicals:
  stage: sync
  image: alpine:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache git rsync bash
    - git config user.email "ci-bot@epita.fr"
    - git config user.name  "CI Bot"
  script:
    - bash ci-scripts/sync_practicals.sh
