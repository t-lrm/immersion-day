istages: [sync]

sync_practicals:
  stage: sync
  image: alpine:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache git rsync bash
    - git config user.email "ci-bot@epita.fr"
    - git config user.name  "CI Bot"
  script:
    - bash ci-scripts/sync_practicals.sh
    - git add ci-imported
    - |
      if ! git diff --cached --quiet; then
        git commit -m "Sync practicals"
        git push origin HEAD:main
      else
        echo "No changes."
      fi

