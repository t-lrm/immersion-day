image: alpine:latest

stages:
  - package

variables:
  # Customize exclusions (space-separated). Use folder/* to exclude a folder.
  EXCLUDES: ".git/* .gitignore .gitlab-ci.yml README.md server.py setup.sh"
  ZIP_NAME: "sujets.zip"

zip_to_repo_root:
  stage: package
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache git zip
    - git config user.email "ci-bot@epita.fr"
    - git config user.name  "CI Bot"
    - git remote set-url origin "https://oauth2:${WRITE_TOKEN}@gitlab.cri.epita.fr/timothee.le-roux-maertens/ji.git"
  script:
    - |
      set -- $EXCLUDES "$ZIP_NAME"
      EXCLUDE_ARGS=
      for p in "$@"; do EXCLUDE_ARGS="$EXCLUDE_ARGS -x $p"; done
      EXCLUDE_ARGS="$EXCLUDE_ARGS -x .git/*"
    - sh -c "zip -r -q \"$ZIP_NAME\" . $EXCLUDE_ARGS"
    - git add -f "$ZIP_NAME"
    - |
      if git diff --cached --quiet; then
        echo "No changes to $ZIP_NAME; nothing to commit."
      else
        git commit -m "chore: update ${ZIP_NAME} for ${CI_COMMIT_SHORT_SHA} [skip ci]"
        git push origin "HEAD:$CI_COMMIT_BRANCH"
      fi
